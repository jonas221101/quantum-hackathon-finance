[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qhf"
version = "0.1.0"
description = "TUM Quantum Hackathon, finance track: allocation route (3-of-6 sector tilt) with QAOA"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.6",
    "scipy==1.17.1",
    "qiskit==2.2.3",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
qhf = "qhf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that run the full pipeline"]
